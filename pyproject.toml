[project]
name = "42-bank"
version = "0.1.0"
description = "Managed Banking Agents for Azure AI Agent Service"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "agent-framework>=1.0.0rc3",
    "agent-framework-a2a>=1.0.0b260212",
    "azure-ai-projects>=2.0.0b4",
    "azure-identity>=1.26.0b2",
    "azure-cosmos>=4.15.0",
    "fastapi>=0.135.1",
    "httpx>=0.28.1",
    "mcp>=1.26.0",
    "pqcrypto>=0.4.0",
    "pydantic>=2.10.0,<2.13",
    "pyjwt>=2.10.0",
    "slowapi>=0.1.9",
    "python-dotenv>=1.2.2",
    "starlette>=1.0.0rc1",
    "uvicorn>=0.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "types-requests>=2.32.4",
    "pyright>=0.0.0",
]

[tool.uv]
prerelease = "allow"

[dependency-groups]
dev = [
    "pyright>=0.0.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "types-requests>=2.32.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
markers = [
    "mcp: MCP server tests",
    "a2a: A2A agent tests",
    "e2e: End-to-end integration tests",
    "slow: Slow tests (>5s)"
]
