[project]
name = "42-bank"
version = "0.1.0"
description = "Managed Banking Agents for Azure AI Agent Service"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "agent-framework",
    "azure-ai-projects",
    "azure-identity",
    "cryptography",
    "httpx",
    "pqcrypto",
    "pydantic",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[tool.uv]
prerelease = "allow"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]
