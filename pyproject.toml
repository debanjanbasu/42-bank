[project]
name = "42-bank"
version = "0.1.0"
description = "Managed Banking Agents for Azure AI Agent Service"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "agent-framework",
    "agent-framework-a2a>=1.0.0b260212",
    "azure-ai-projects",
    "azure-identity",
    "azure-cosmos>=4.7.0",
    "fastapi>=0.115.0",
    "httpx",
    "mcp>=1.0.0",
    "pqcrypto",
    "pydantic",
    "pyjwt>=2.9.0",
    "python-dotenv",
    "starlette",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[tool.uv]
prerelease = "allow"

[dependency-groups]
dev = [
  "pytest>=9.0.2",
  "pytest-asyncio>=1.3.0",
  "types-requests",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
markers = [
    "mcp: MCP server tests",
    "a2a: A2A agent tests", 
    "e2e: End-to-end integration tests",
    "slow: Slow tests (>5s)"
]
