# Docker Compose for 42-Bank local development
#
# Docker is required for local development (Cosmos DB emulator).
#
# Usage:
#   docker-compose up -d              # Start Cosmos emulator (required)
#   ./dev.sh alice                    # Run backend (emulator must be up)
#   docker-compose down               # Stop all
#
# Services:
#   - cosmos-emulator: Azure Cosmos DB emulator (required for all dev)
#   - cosmos-mcp: Cosmos DB MCP Toolkit (optional, profile: mcp-toolkit)
#   - banking-mcp: Custom banking MCP server (optional, profile: banking-tools)
#
# Requirements:
#   - Docker Desktop installed and running
#   - ~2GB RAM available for emulator
#   - ~10GB disk space for data

version: '3.8'

services:
  # Cosmos DB Linux Emulator (vNext - Preview)
  # https://learn.microsoft.com/azure/cosmos-db/emulator-linux
  cosmos-emulator:
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-preview
    container_name: 42bank-cosmos
    ports:
      - "8081:8081"   # Gateway endpoint (API)
      - "1234:1234"   # Data explorer UI
    environment:
      - PROTOCOL=https
    volumes:
      - cosmos-data:/data
    healthcheck:
      test: ["CMD", "curl", "-k", "-s", "-f", "https://localhost:8081/_explorer/index.html"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # Cosmos DB MCP Toolkit (Microsoft Official)
  # https://github.com/AzureCosmosDB/MCPToolKit
  # Note: This is a .NET application - may need custom build
  # Comment out if not needed for local testing
  cosmos-mcp:
    image: mcr.microsoft.com/cosmosdb/mcp-toolkit:latest
    container_name: 42bank-cosmos-mcp
    profiles:
      - mcp-toolkit
    ports:
      - "9000:8080"
    environment:
      - COSMOS_ENDPOINT=https://cosmos-emulator:8081
      - COSMOS_KEY=C2y6yDjf5/R+ob0N8A7Cgv30VRDJIWEHLM+4QDU5DE2nQ9nDuVTqobD4b8mGGyPMbIZnqyMsEcaGQy67XIw/Jw==
      - DATABASE_ID=banking
    depends_on:
      cosmos-emulator:
        condition: service_healthy
    restart: unless-stopped

  # 42-Bank Banking MCP Server (Custom)
  # Build from local Dockerfile for banking-specific tools
  banking-mcp:
    build:
      context: .
      dockerfile: Dockerfile.banking-mcp
    container_name: 42bank-banking-mcp
    profiles:
      - banking-tools
    ports:
      - "8002:8002"
    environment:
      - COSMOS_MCP_URL=http://cosmos-mcp:8080/mcp
      - COSMOS_DATABASE=banking
    depends_on:
      - cosmos-mcp
    restart: unless-stopped

volumes:
  cosmos-data:
    name: 42bank-cosmos-data
