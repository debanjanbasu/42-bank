# 42 Bank Agent Definition for Azure Developer CLI
# Used with: azd ai agent init -m agent.yaml

name: 42-bank-agent
description: Banking agent with A2A/MCP compliance for Azure AI Foundry
version: "1.0"

# Container configuration
image: ${AZURE_CONTAINER_REGISTRY}.azurecr.io/42-bank-agent:latest
platform: linux/amd64

# Resource allocation
cpu: "1"
memory: "2Gi"

# Environment variables (set in Foundry portal)
environment:
  AZURE_AI_PROJECT_ENDPOINT: ${AZURE_AI_PROJECT_ENDPOINT}
  AZURE_AI_MODEL_DEPLOYMENT_NAME: qwen2.5-14b
  BANK_USER: alice

# Protocol support
protocols:
  - name: responses
    version: v1

# Scaling configuration
scaling:
  minReplicas: 0  # Scale to zero when idle
  maxReplicas: 2
