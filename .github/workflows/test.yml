name: Test & Lint

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  python-test:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync

      - name: Run type checking
        run: uv run pyright api/ ledger.py audit_service.py utils.py
        continue-on-error: true

      - name: Run linter
        run: uv run ruff check .
        continue-on-error: true

      - name: Run tests (MCP only — no LLM required)
        run: uv run pytest tests/test_mcp_tools.py -v --timeout=60
        env:
          APP_ENV: test
          JWT_SECRET: test-secret-for-ci-only-not-production

  mobile-typecheck:
    name: Mobile TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: npm ci --legacy-peer-deps

      - name: Apply patches
        working-directory: mobile
        run: npx patch-package

      - name: Type check
        working-directory: mobile
        run: npm run typecheck
        continue-on-error: true

      - name: Lint
        working-directory: mobile
        run: npm run lint
        continue-on-error: true
