name: Docker Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build main image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          tags: 42bank:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build banking-mcp image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.banking-mcp
          push: false
          tags: 42bank-banking-mcp:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
